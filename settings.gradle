rootProject.name = 'decycle'

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

include('decycle-lib')
include('decycle-gradle-plugin')
include('decycle-maven-plugin')

project(':decycle-lib').projectDir = file("lib")
project(':decycle-gradle-plugin').projectDir = file("plugin-gradle")
project(':decycle-maven-plugin').projectDir = file("plugin-maven")
